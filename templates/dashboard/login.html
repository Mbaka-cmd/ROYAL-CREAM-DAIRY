{% extends "dashboard/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="panel narrow-box">
  <h1>Owner login</h1>
  <form method="post">
    {% csrf_token %}
    {% include "dashboard/_form_fields.html" with form=form %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  {% if demo_login_enabled %}
  <p class="login-or"><span>or</span></p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-block btn-outline" type="submit" name="demo_login" value="1">Enter demo as Owner</button>
  </form>
  {% endif %}
</div>
{% endblock %}
