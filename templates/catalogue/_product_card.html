<article class="card">
  <a class="card-media" href="{% url 'product_detail' p.slug %}" tabindex="-1" aria-hidden="true">
    {% if p.image %}<img src="{{ p.image.url }}" alt="" loading="lazy">{% else %}<span class="placeholder">{{ p.name|slice:":1" }}</span>{% endif %}
  </a>
  <div class="card-body">
    <p class="eyebrow">{{ p.category.name }}</p>
    <h3><a href="{% url 'product_detail' p.slug %}">{{ p.name }}</a></h3>
    {% include "catalogue/_variants.html" with product=p %}
  </div>
</article>
